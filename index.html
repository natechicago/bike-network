<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chicago Bike Network (Dec 2025) + Proposals</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
  #map { position: absolute; inset: 0; }

  #legend {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1;
    background: #fff;
    padding: 12px 14px;
    border-radius: 6px;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
    font-size: 13px;
    max-width: 260px;
  }
  #legend h3 { margin: 0 0 8px; font-size: 14px; }
  #legend .row {
    display: flex;
    align-items: center;
    margin: 5px 0;
    cursor: pointer;
    user-select: none;
  }
  #legend .row input[type="checkbox"] {
    margin: 0 8px 0 0;
    cursor: pointer;
  }
  #legend .row.off .swatch { opacity: 0.25; }
  #legend .row.off .label { color: #aaa; text-decoration: line-through; }
  #legend .swatch {
    display: inline-block;
    width: 22px;
    height: 4px;
    margin-right: 10px;
    flex-shrink: 0;
  }
  #legend .swatch.pbl     { height: 6px; background: #22CBDE; border-top: 1px solid #221C4C; border-bottom: 1px solid #221C4C; }
  #legend .swatch.green   { background: #2FB13F; }
  #legend .swatch.buff    { height: 5px; background: #2CBDEE; }
  #legend .swatch.lane    { background: repeating-linear-gradient(90deg, #2CBDEE 0 5px, transparent 5px 8px); }
  #legend .swatch.trail   { height: 5px; background: #196a3a; }
  #legend .swatch.trail2  { height: 5px; background: #9c4dcc; }
  .maplibregl-popup-content { font-size: 12px; line-height: 1.5; padding: 10px 14px; }
  .maplibregl-popup-content strong { font-size: 13px; }
  #legend .swatch.crime   { height: 10px; background: #ff8a8a; opacity: 0.7; border: 1px solid #d97070; }

  #legend .footnote {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #eee;
    font-size: 11px;
    color: #555;
    line-height: 1.5;
  }
  #legend button {
    margin-top: 6px;
    font-size: 11px;
    padding: 4px 8px;
    cursor: pointer;
  }

</style>
</head>
<body>
<div id="map"></div>

<div id="legend">
  <h3>Chicago Bike Network</h3>
  <label class="row"><input type="checkbox" data-facility="Protected Bike Lane" checked disabled><span class="swatch pbl"></span><span class="label">Protected</span></label>
  <label class="row off"><input type="checkbox" data-facility="Neighborhood Greenway" disabled><span class="swatch green"></span><span class="label">Greenway</span></label>
  <label class="row"><input type="checkbox" data-facility="Buffered Bike Lane" checked disabled><span class="swatch buff"></span><span class="label">Buffered</span></label>
  <label class="row"><input type="checkbox" data-facility="Bike Lane" checked disabled><span class="swatch lane"></span><span class="label">Standard</span></label>
  <label class="row off"><input type="checkbox" data-facility="Off-Street Trail" disabled><span class="swatch trail"></span><span class="label">Off-Street Trail</span></label>
  <label class="row"><input type="checkbox" data-facility="Trails v2" checked disabled><span class="swatch trail2"></span><span class="label">Trails v2</span></label>
  <div class="footnote">
    <label class="row off"><input type="checkbox" id="toggle-crime"><span class="swatch crime"></span><span class="label">Crime</span></label>
  </div>
</div>

<script>
const FEATURE_SERVICE_URL =
  'https://services7.arcgis.com/A03QrhyHnDaUmK0W/arcgis/rest/services/' +
  'Dec2025_Bike_Network_Internal_Basemap/FeatureServer/0/query' +
  '?where=1%3D1&outFields=*&outSR=4326&f=geojson';

const TRAILS_URL =
  'https://services7.arcgis.com/A03QrhyHnDaUmK0W/arcgis/rest/services/' +
  'Trails_Network_2024_11_18/FeatureServer/0/query' +
  '?where=1%3D1&outFields=*&outSR=4326&f=geojson';

const TRAILS_V2_URL = './trails-v2.geojson';

const escapeHtml = (value) => String(value)
  .replaceAll('&', '&amp;')
  .replaceAll('<', '&lt;')
  .replaceAll('>', '&gt;')
  .replaceAll('"', '&quot;')
  .replaceAll("'", '&#39;');

const PROPOSED_PBLS_URL = './proposed-pbls.geojson';
const HIGH_CRIME_URL   = './high-crime-neighborhoods.geojson';

// Colors lifted straight from the WebMap's CIM symbology.
const PBL_COLOR  = '#22CBDE';
const PBL_CASING = '#221C4C';
const GREENWAY_COLOR = '#2FB13F';
const LANE_COLOR = '#2CBDEE';
const TRAIL_COLOR = '#196a3a';
const TRAILS_V2_COLOR = '#9c4dcc';

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      carto: {
        type: 'raster',
        tiles: [
          'https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png',
          'https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png',
          'https://c.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png',
          'https://d.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png'
        ],
        tileSize: 256,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors ' +
          '&copy; <a href="https://carto.com/attributions">CARTO</a> &middot; ' +
          'Bike data: <a href="https://www.chicago.gov/city/en/sites/complete-streets-chicago/home/bike-program/existing-bike-network.html">CDOT</a>'
      }
    },
    layers: [{ id: 'basemap', type: 'raster', source: 'carto' }]
  },
  center: [-87.65, 41.88],
  zoom: 11
});

map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.addControl(
  new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: true,
    showUserHeading: true,
    fitBoundsOptions: { maxZoom: 16 }
  }),
  'top-right'
);
map.addControl(new maplibregl.ScaleControl({ unit: 'imperial' }), 'bottom-left');

map.on('load', async () => {
  // Load high-crime neighborhoods first so their fill layer sits beneath the
  // bike-network lines.
  let highCrime = { type: 'FeatureCollection', features: [] };
  try {
    const crimeRes = await fetch(HIGH_CRIME_URL, { cache: 'no-cache' });
    if (crimeRes.ok) {
      highCrime = await crimeRes.json();
      console.log('Loaded ' + (highCrime.features || []).length + ' high-crime neighborhoods');
    }
  } catch (err) {
    console.warn('Could not load high-crime-neighborhoods.geojson:', err);
  }
  map.addSource('high-crime', { type: 'geojson', data: highCrime });
  map.addLayer({
    id: 'high-crime-fill',
    type: 'fill',
    source: 'high-crime',
    layout: { visibility: 'none' },
    paint: {
      'fill-color': '#ff8a8a',
      'fill-opacity': 0.22
    }
  });
  map.addLayer({
    id: 'high-crime-outline',
    type: 'line',
    source: 'high-crime',
    layout: { 'line-cap': 'round', 'line-join': 'round', visibility: 'none' },
    paint: {
      'line-color': '#d97070',
      'line-width': 0.8,
      'line-opacity': 0.6
    }
  });

  const response = await fetch(FEATURE_SERVICE_URL);
  if (!response.ok) {
    alert('Failed to load Chicago bike network: ' + response.status);
    return;
  }
  const geojson = await response.json();
  console.log('Loaded ' + (geojson.features || []).length + ' bike network segments');

  map.addSource('bike-network', { type: 'geojson', data: geojson });

  // PBL has a dark casing rendered first so the cyan color line sits on top of it.
  map.addLayer({
    id: 'pbl-casing',
    type: 'line',
    source: 'bike-network',
    filter: ['==', ['get', 'BIKE_DSPLY'], 'Protected Bike Lane'],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': PBL_CASING, 'line-width': 5 }
  });

  map.addLayer({
    id: 'bike-lane',
    type: 'line',
    source: 'bike-network',
    filter: ['==', ['get', 'BIKE_DSPLY'], 'Bike Lane'],
    layout: { 'line-cap': 'butt', 'line-join': 'round' },
    paint: { 'line-color': LANE_COLOR, 'line-width': 2, 'line-dasharray': [3, 2] }
  });
  map.addLayer({
    id: 'buffered-lane',
    type: 'line',
    source: 'bike-network',
    filter: ['==', ['get', 'BIKE_DSPLY'], 'Buffered Bike Lane'],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': LANE_COLOR, 'line-width': 3.5 }
  });
  // Neighborhood Greenway: simple solid green single line (no casing).
  map.addLayer({
    id: 'greenway',
    type: 'line',
    source: 'bike-network',
    filter: ['==', ['get', 'BIKE_DSPLY'], 'Neighborhood Greenway'],
    layout: { 'line-cap': 'round', 'line-join': 'round', visibility: 'none' },
    paint: { 'line-color': GREENWAY_COLOR, 'line-width': 2 }
  });
  map.addLayer({
    id: 'pbl',
    type: 'line',
    source: 'bike-network',
    filter: ['==', ['get', 'BIKE_DSPLY'], 'Protected Bike Lane'],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': PBL_COLOR, 'line-width': 3 }
  });

  // Off-street trails — separate feature service, different schema.
  try {
    const trailsRes = await fetch(TRAILS_URL);
    if (trailsRes.ok) {
      const trailsGeo = await trailsRes.json();
      console.log('Loaded ' + (trailsGeo.features || []).length + ' off-street trail segments');

      // Compute total mileage per ST_NAME so the popup can show the full
      // trail length rather than just the clicked segment.
      const totalsByName = {};
      for (const f of trailsGeo.features || []) {
        const n = (f.properties && f.properties.ST_NAME) || '';
        const m = Number((f.properties && f.properties.MI_CTRLINE) || 0);
        totalsByName[n] = (totalsByName[n] || 0) + m;
      }
      for (const f of trailsGeo.features || []) {
        const n = (f.properties && f.properties.ST_NAME) || '';
        f.properties._total_mi = Number((totalsByName[n] || 0).toFixed(2));
      }

      map.addSource('off-street-trails', { type: 'geojson', data: trailsGeo });
      map.addLayer({
        id: 'off-street-trail',
        type: 'line',
        source: 'off-street-trails',
        layout: { 'line-cap': 'round', 'line-join': 'round', visibility: 'none' },
        paint: { 'line-color': TRAIL_COLOR, 'line-width': 3 }
      });
    }
  } catch (err) {
    console.warn('Could not load off-street trails:', err);
  }

  // Trails v2 — sibling GeoJSON with longer Chicagoland trails sourced from OSM.
  try {
    const t2Res = await fetch(TRAILS_V2_URL, { cache: 'no-cache' });
    if (t2Res.ok) {
      const t2Geo = await t2Res.json();
      console.log('Loaded ' + (t2Geo.features || []).length + ' Trails v2 features');
      map.addSource('trails-v2', { type: 'geojson', data: t2Geo });
      map.addLayer({
        id: 'trails-v2',
        type: 'line',
        source: 'trails-v2',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': TRAILS_V2_COLOR, 'line-width': 3 }
      });
    }
  } catch (err) {
    console.warn('Could not load trails-v2:', err);
  }

  // Click popup — trails only. Single map-level handler so overlapping
  // features only produce one popup.
  const trailClickLayers = ['off-street-trail', 'trails-v2'];
  map.on('click', (e) => {
    const features = map.queryRenderedFeatures(e.point, { layers: trailClickLayers });
    if (features.length === 0) return;
    const f = features[0];
    const a = f.properties || {};
    let name, miles;
    if (f.layer.id === 'trails-v2') {
      name = a.name || '(unnamed)';
      miles = Number(a.length_mi || 0).toFixed(1);
    } else {
      name = a.ST_NAME || '(unnamed)';
      miles = Number(a._total_mi || 0).toFixed(1);
    }
    const html =
      '<strong>' + escapeHtml(name) + '</strong><br>' +
      '<small>' + miles + ' mi total</small>';
    new maplibregl.Popup().setLngLat(e.lngLat).setHTML(html).addTo(map);
  });
  map.on('mousemove', (e) => {
    const features = map.queryRenderedFeatures(e.point, { layers: trailClickLayers });
    map.getCanvas().style.cursor = features.length > 0 ? 'pointer' : '';
  });

  // Proposed PBLs — loaded from a sibling file. Same source as existing PBLs
  // styling-wise, just rendered as their own layer so a missing file doesn't
  // break anything.
  let proposedPbls = { type: 'FeatureCollection', features: [] };
  try {
    const proposedRes = await fetch(PROPOSED_PBLS_URL, { cache: 'no-cache' });
    if (proposedRes.ok) {
      proposedPbls = await proposedRes.json();
      console.log('Loaded ' + (proposedPbls.features || []).length + ' proposed PBLs');
    }
  } catch (err) {
    console.warn('Could not load proposed-pbls.geojson:', err);
  }

  map.addSource('proposed-pbls', { type: 'geojson', data: proposedPbls });
  map.addLayer({
    id: 'proposed-pbl-casing',
    type: 'line',
    source: 'proposed-pbls',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': PBL_CASING, 'line-width': 5 }
  });
  map.addLayer({
    id: 'proposed-pbl',
    type: 'line',
    source: 'proposed-pbls',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': PBL_COLOR, 'line-width': 3 }
  });

  // --- Facility-type show/hide toggles ---
  // Each facility type may map to multiple MapLibre layers (PBL has a casing
  // layer beneath its color layer, plus the proposed-PBL casing/color pair).
  const facilityLayerIds = {
    'Protected Bike Lane':   ['pbl-casing', 'pbl', 'proposed-pbl-casing', 'proposed-pbl'],
    'Neighborhood Greenway': ['greenway'],
    'Buffered Bike Lane':    ['buffered-lane'],
    'Bike Lane':             ['bike-lane'],
    'Off-Street Trail':      ['off-street-trail'],
    'Trails v2':             ['trails-v2']
  };

  const checkboxes = document.querySelectorAll('#legend input[type="checkbox"][data-facility]');
  for (const checkbox of checkboxes) {
    checkbox.addEventListener('change', (event) => {
      const facility = event.target.dataset.facility;
      const visible = event.target.checked;
      const layerIds = facilityLayerIds[facility] || [];
      for (const layerId of layerIds) {
        map.setLayoutProperty(layerId, 'visibility', visible ? 'visible' : 'none');
      }
      // Dim the legend row when its layer is hidden.
      event.target.closest('.row').classList.toggle('off', !visible);
    });
    // Now that the listener is attached and layers exist, accept input.
    checkbox.disabled = false;
  }

  // High-crime overlay toggle.
  const crimeToggle = document.getElementById('toggle-crime');
  crimeToggle.addEventListener('change', (event) => {
    const visible = event.target.checked;
    map.setLayoutProperty('high-crime-fill', 'visibility', visible ? 'visible' : 'none');
    map.setLayoutProperty('high-crime-outline', 'visibility', visible ? 'visible' : 'none');
    event.target.closest('.row').classList.toggle('off', !visible);
  });

});
</script>
</body>
</html>
